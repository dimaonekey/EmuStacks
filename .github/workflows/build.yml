name: EmuStacks Monolithic All-In-One

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-guest-daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Generate & Compile Guest uinput Daemon (C)
        shell: bash
        run: |
          mkdir -p guest build_daemon
          cat << 'EOF' > guest/guest_uinput.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <errno.h>
          #include <sys/socket.h>
          #include <sys/epoll.h>
          #include <netinet/in.h>
          #include <netinet/tcp.h>
          #include <linux/input.h>
          #include <linux/uinput.h>

          #define EMURIN_PORT 8888
          #define MAX_SLOTS 10
          #define MAX_EVENTS 16

          #pragma pack(push, 1)
          typedef struct {
              uint8_t magic;
              uint8_t type;
              int32_t slot;
              int32_t x;
              int32_t y;
              int32_t pressure;
              uint16_t code;
              uint8_t state;
              uint32_t timestamp;
          } Packet;
          #pragma pack(pop)

          static void emit_ev(int fd, uint16_t t, uint16_t c, int32_t v) {
              struct input_event ie;
              memset(&ie, 0, sizeof(ie));
              ie.type = t; ie.code = c; ie.value = v;
              write(fd, &ie, sizeof(ie));
          }

          static int init_uinput(void) {
              int fd = open("/dev/uinput", O_WRONLY | O_NONBLOCK);
              if (fd < 0) return -1;
              ioctl(fd, UI_SET_EVBIT, EV_SYN);
              ioctl(fd, UI_SET_EVBIT, EV_KEY);
              ioctl(fd, UI_SET_EVBIT, EV_ABS);
              ioctl(fd, UI_SET_KEYBIT, BTN_TOUCH);
              for (int k = 1; k < 255; ++k) ioctl(fd, UI_SET_KEYBIT, k);

              ioctl(fd, UI_SET_ABSBIT, ABS_X);
              ioctl(fd, UI_SET_ABSBIT, ABS_Y);
              ioctl(fd, UI_SET_ABSBIT, ABS_MT_SLOT);
              ioctl(fd, UI_SET_ABSBIT, ABS_MT_POSITION_X);
              ioctl(fd, UI_SET_ABSBIT, ABS_MT_POSITION_Y);
              ioctl(fd, UI_SET_ABSBIT, ABS_MT_TRACKING_ID);

              struct uinput_user_dev dev;
              memset(&dev, 0, sizeof(dev));
              strncpy(dev.name, "EmuStacks-Virtual-Input", UINPUT_MAX_NAME_SIZE);
              dev.id.bustype = BUS_VIRTUAL;
              dev.absmax[ABS_X] = 1920; dev.absmax[ABS_Y] = 1080;
              dev.absmax[ABS_MT_POSITION_X] = 1920; dev.absmax[ABS_MT_POSITION_Y] = 1080;
              dev.absmax[ABS_MT_SLOT] = MAX_SLOTS - 1; dev.absmax[ABS_MT_TRACKING_ID] = 65535;

              write(fd, &dev, sizeof(dev));
              ioctl(fd, UI_DEV_CREATE);
              return fd;
          }

          int main(void) {
              int ufd = init_uinput();
              if (ufd < 0) return 1;

              int sfd = socket(AF_INET, SOCK_STREAM, 0);
              int opt = 1;
              setsockopt(sfd, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof(opt));
              setsockopt(sfd, IPPROTO_TCP, TCP_NODELAY, &opt, sizeof(opt));

              struct sockaddr_in sin = { .sin_family = AF_INET, .sin_addr.s_addr = INADDR_ANY, .sin_port = htons(EMURIN_PORT) };
              bind(sfd, (struct sockaddr *)&sin, sizeof(sin));
              listen(sfd, 2);

              int ep = epoll_create1(0);
              struct epoll_event ev = { .events = EPOLLIN, .data.fd = sfd }, evs[MAX_EVENTS];
              epoll_ctl(ep, EPOLL_CTL_ADD, sfd, &ev);

              uint8_t buf[sizeof(Packet) * 32];
              size_t len = 0;

              for (;;) {
                  int n = epoll_wait(ep, evs, MAX_EVENTS, -1);
                  for (int i = 0; i < n; ++i) {
                      if (evs[i].data.fd == sfd) {
                          int cfd = accept(sfd, NULL, NULL);
                          if (cfd >= 0) {
                              setsockopt(cfd, IPPROTO_TCP, TCP_NODELAY, &opt, sizeof(opt));
                              ev.events = EPOLLIN | EPOLLET; ev.data.fd = cfd;
                              epoll_ctl(ep, EPOLL_CTL_ADD, cfd, &ev);
                          }
                      } else {
                          int cfd = evs[i].data.fd;
                          ssize_t r = read(cfd, buf + len, sizeof(buf) - len);
                          if (r > 0) {
                              len += r;
                              size_t off = 0;
                              while (len - off >= sizeof(Packet)) {
                                  Packet *p = (Packet *)(buf + off);
                                  if (p->magic == 0xEE) {
                                      if (p->type == 1) {
                                          emit_ev(ufd, EV_ABS, ABS_MT_SLOT, p->slot);
                                          if (p->state == 1) {
                                              emit_ev(ufd, EV_ABS, ABS_MT_TRACKING_ID, p->slot + 1);
                                              emit_ev(ufd, EV_KEY, BTN_TOUCH, 1);
                                              emit_ev(ufd, EV_ABS, ABS_MT_POSITION_X, p->x);
                                              emit_ev(ufd, EV_ABS, ABS_MT_POSITION_Y, p->y);
                                          } else if (p->state == 2) {
                                              emit_ev(ufd, EV_ABS, ABS_MT_POSITION_X, p->x);
                                              emit_ev(ufd, EV_ABS, ABS_MT_POSITION_Y, p->y);
                                          } else {
                                              emit_ev(ufd, EV_ABS, ABS_MT_TRACKING_ID, -1);
                                              emit_ev(ufd, EV_KEY, BTN_TOUCH, 0);
                                          }
                                      } else if (p->type == 2) {
                                          emit_ev(ufd, EV_KEY, p->code, p->state ? 1 : 0);
                                      }
                                      emit_ev(ufd, EV_SYN, SYN_REPORT, 0);
                                      off += sizeof(Packet);
                                  } else { off++; }
                              }
                              if (off > 0) { memmove(buf, buf + off, len - off); len -= off; }
                          } else if (r == 0 || (r < 0 && errno != EAGAIN)) {
                              epoll_ctl(ep, EPOLL_CTL_DEL, cfd, NULL);
                              close(cfd); len = 0;
                          }
                      }
                  }
              }
              close(sfd); close(ufd);
              return 0;
          }
          EOF

          ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang \
            -static -O3 guest/guest_uinput.c -o build_daemon/emustacks_daemon

      - uses: actions/upload-artifact@v4
        with:
          name: emustacks-daemon
          path: build_daemon/emustacks_daemon

  build-host-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - run: vcpkg install lua:x64-windows-static

      - name: Generate Host Engine, Lua UI & CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "host"
          New-Item -ItemType Directory -Force -Path "scripts"

          # 1. Скрипт интерфейса чисто на LUA (mimgui dark-gray style)
          Set-Content -Path "scripts/interface.lua" -Value @'
          local ui = {}

          local FONT_TAHOMA = 0
          local FONT_TREBUCHET = 1

          ui.state = {
              aim_lock = false,
              sens_x = 2.0,
              sens_y = 2.0,
              show_overlay = true,
              engine_name = "BlueStacks 5 (Hijacked)"
          }

          function ui.apply_palette()
              imgui.StyleColorsDark()
              imgui.SetColor(imgui.Col_WindowBg,             0.11, 0.11, 0.12, 0.98)
              imgui.SetColor(imgui.Col_ChildBg,              0.14, 0.14, 0.16, 1.00)
              imgui.SetColor(imgui.Col_Border,               0.24, 0.24, 0.28, 0.60)
              imgui.SetColor(imgui.Col_BorderShadow,         0.00, 0.00, 0.00, 0.00)
              imgui.SetColor(imgui.Col_FrameBg,              0.18, 0.18, 0.22, 1.00)
              imgui.SetColor(imgui.Col_FrameBgHovered,       0.25, 0.25, 0.30, 1.00)
              imgui.SetColor(imgui.Col_FrameBgActive,        0.30, 0.30, 0.36, 1.00)
              imgui.SetColor(imgui.Col_TitleBg,              0.08, 0.08, 0.09, 1.00)
              imgui.SetColor(imgui.Col_TitleBgActive,        0.12, 0.12, 0.14, 1.00)
              imgui.SetColor(imgui.Col_CheckMark,            0.75, 0.75, 0.80, 1.00)
              imgui.SetColor(imgui.Col_SliderGrab,           0.50, 0.50, 0.56, 1.00)
              imgui.SetColor(imgui.Col_SliderGrabActive,     0.68, 0.68, 0.76, 1.00)
              imgui.SetColor(imgui.Col_Button,               0.20, 0.20, 0.24, 1.00)
              imgui.SetColor(imgui.Col_ButtonHovered,        0.32, 0.32, 0.38, 1.00)
              imgui.SetColor(imgui.Col_ButtonActive,         0.42, 0.42, 0.50, 1.00)
              imgui.SetColor(imgui.Col_Header,               0.22, 0.22, 0.26, 1.00)
              imgui.SetColor(imgui.Col_HeaderHovered,        0.32, 0.32, 0.38, 1.00)
              imgui.SetColor(imgui.Col_HeaderActive,         0.40, 0.40, 0.48, 1.00)
              imgui.SetColor(imgui.Col_Separator,            0.24, 0.24, 0.28, 1.00)
              imgui.SetColor(imgui.Col_Text,                 0.88, 0.88, 0.90, 1.00)
              imgui.SetColor(imgui.Col_TextDisabled,         0.48, 0.48, 0.52, 1.00)
          end

          function ui.render_frame(window_w, window_h)
              local sidebar_w = 260
              local viewport_w = window_w - sidebar_w

              if ui.state.show_overlay and viewport_w > 150 then
                  imgui.PushFont(FONT_TAHOMA)
                  imgui.DrawKeyBadge("WASD", 0.16 * viewport_w, 0.70 * window_h)
                  imgui.DrawKeyBadge("SPC",  0.88 * viewport_w, 0.82 * window_h)
                  imgui.DrawKeyBadge("C",    0.80 * viewport_w, 0.90 * window_h)
                  imgui.DrawKeyBadge("SHF",  0.16 * viewport_w, 0.48 * window_h)
                  imgui.DrawKeyBadge("F",    0.68 * viewport_w, 0.58 * window_h)
                  imgui.DrawKeyBadge("R",    0.88 * viewport_w, 0.58 * window_h)
                  imgui.PopFont()
              end

              imgui.SetNextWindowPos(viewport_w, 0)
              imgui.SetNextWindowSize(sidebar_w, window_h)
              imgui.Begin("##EmuStacksSidebar", 0)

              imgui.PushFont(FONT_TREBUCHET)
              imgui.TextColored("EMUSTACKS CORE", 0.92, 0.92, 0.95, 1.0)
              imgui.PopFont()

              imgui.PushFont(FONT_TAHOMA)
              imgui.TextDisabled("mimgui / slate-gray runtime")
              imgui.Separator()
              imgui.Spacing()

              imgui.Text("ATTACHED ENGINE:")
              imgui.TextColored(ui.state.engine_name, 0.65, 0.65, 0.72, 1.0)

              imgui.Spacing()
              imgui.Text("STATUS:")
              if host.is_bridge_connected() then
                  imgui.TextColored("[ONLINE] Zero-Lag Kernel", 0.45, 0.85, 0.50, 1.0)
              else
                  imgui.TextColored("[CONNECTING] Local TCP", 0.85, 0.65, 0.30, 1.0)
              end

              imgui.Spacing()
              imgui.Separator()
              imgui.Spacing()

              if imgui.Button("BACK  [ESC]", -1, 32) then host.send_key(158) end
              if imgui.Button("HOME", -1, 32) then host.send_key(102) end
              if imgui.Button("TASKS", -1, 32) then host.send_key(580) end

              imgui.Spacing()
              imgui.Separator()
              imgui.Spacing()

              local aim_pressed, new_aim = imgui.Checkbox("FPS Aim Lock (F10)", ui.state.aim_lock)
              if aim_pressed then
                  ui.state.aim_lock = new_aim
                  host.toggle_fps_aim(ui.state.aim_lock)
              end

              local ovr_pressed, new_ovr = imgui.Checkbox("Keymap HUD Overlay", ui.state.show_overlay)
              if ovr_pressed then ui.state.show_overlay = new_ovr end

              imgui.Spacing()
              local sx_chg, new_sx = imgui.SliderFloat("Sens X", ui.state.sens_x, 0.1, 5.0)
              if sx_chg then ui.state.sens_x = new_sx; host.set_sensitivity(ui.state.sens_x, ui.state.sens_y) end

              local sy_chg, new_sy = imgui.SliderFloat("Sens Y", ui.state.sens_y, 0.1, 5.0)
              if sy_chg then ui.state.sens_y = new_sy; host.set_sensitivity(ui.state.sens_x, ui.state.sens_y) end

              imgui.Spacing()
              imgui.Separator()
              imgui.Spacing()

              if imgui.Button("Reload interface.lua", -1, 28) then
                  host.reload_interface()
              end

              imgui.PopFont()
              imgui.End()
          end

          return ui
          '@ -Encoding UTF8

          # 2. C++ Host Bridge (Win32, DirectX 11, Fonts Loader, ImGui-to-Lua Bridge)
          Set-Content -Path "host/emustacks_host.cpp" -Value @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <d3d11.h>
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <dwmapi.h>
          #include <string>
          #include <thread>
          #include <atomic>
          #include <mutex>

          #include "imgui.h"
          #include "imgui_impl_win32.h"
          #include "imgui_impl_dx11.h"

          extern "C" {
              #include <lua.h>
              #include <lualib.h>
              #include <lauxlib.h>
          }

          #pragma comment(lib, "d3d11.lib")
          #pragma comment(lib, "dxgi.lib")
          #pragma comment(lib, "ws2_32.lib")
          #pragma comment(lib, "dwmapi.lib")

          extern IMGUI_IMPL_API LRESULT ImGui_ImplWin32_WndProcHandler(HWND hWnd, UINT msg, WPARAM wParam, LPARAM lParam);

          #pragma pack(push, 1)
          struct Packet {
              uint8_t magic = 0xEE;
              uint8_t type;
              int32_t slot;
              int32_t x;
              int32_t y;
              int32_t pressure;
              uint16_t code;
              uint8_t state;
              uint32_t timestamp = 0;
          };
          #pragma pack(pop)

          static ID3D11Device*            g_pd3dDevice = nullptr;
          static ID3D11DeviceContext*     g_pd3dDeviceContext = nullptr;
          static IDXGISwapChain*          g_pSwapChain = nullptr;
          static ID3D11RenderTargetView*  g_mainRenderTargetView = nullptr;
          static HWND                     g_hMainWnd = nullptr;
          static HWND                     g_hViewportWnd = nullptr;
          static HWND                     g_hHijackedWnd = nullptr;
          static SOCKET                   g_BridgeSock = INVALID_SOCKET;

          static lua_State*               g_Lua = nullptr;
          static std::mutex               g_LuaLock;
          static std::atomic<bool>        g_Running(true);
          static std::atomic<bool>        g_BridgeConnected(false);
          static std::atomic<bool>        g_FpsAimMode(false);
          static float                    g_SensX = 2.0f;
          static float                    g_SensY = 2.0f;
          static ImFont*                  g_FontTahoma = nullptr;
          static ImFont*                  g_FontTrebuchet = nullptr;

          static void SendPacket(const Packet& pkt) {
              if (g_BridgeSock != INVALID_SOCKET) {
                  send(g_BridgeSock, (const char*)&pkt, sizeof(Packet), 0);
              }
          }

          static int lua_host_send_key(lua_State* L) {
              int code = (int)luaL_checkinteger(L, 1);
              Packet p{0xEE, 2, 0, 0, 0, 0, (uint16_t)code, 1, 0};
              SendPacket(p);
              p.state = 0;
              SendPacket(p);
              return 0;
          }

          static int lua_host_toggle_fps(lua_State* L) {
              bool aim = lua_toboolean(L, 1);
              g_FpsAimMode = aim;
              if (aim) {
                  RECT rc; GetWindowRect(g_hViewportWnd, &rc); ClipCursor(&rc); ShowCursor(FALSE);
              } else {
                  ClipCursor(nullptr); ShowCursor(TRUE);
              }
              return 0;
          }

          static int lua_host_is_bridge(lua_State* L) {
              lua_pushboolean(L, g_BridgeConnected.load());
              return 1;
          }

          static int lua_host_set_sens(lua_State* L) {
              g_SensX = (float)luaL_checknumber(L, 1);
              g_SensY = (float)luaL_checknumber(L, 2);
              return 0;
          }

          static int lua_host_reload(lua_State* L) {
              if (luaL_dofile(L, "scripts/interface.lua") == LUA_OK) {
                  lua_setglobal(L, "UIModule");
                  lua_getglobal(L, "UIModule");
                  lua_getfield(L, -1, "apply_palette");
                  lua_pcall(L, 0, 0, 0);
                  lua_pop(L, 1);
              }
              return 0;
          }

          static int lua_imgui_begin(lua_State* L) {
              const char* name = luaL_checkstring(L, 1);
              int flags = (int)luaL_optinteger(L, 2, 0);
              imgui::Begin(name, nullptr, flags | ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize | ImGuiWindowFlags_NoMove);
              return 0;
          }

          static int lua_imgui_end(lua_State* L) { imgui::End(); return 0; }
          static int lua_imgui_set_pos(lua_State* L) {
              imgui::SetNextWindowPos(ImVec2((float)luaL_checknumber(L, 1), (float)luaL_checknumber(L, 2)));
              return 0;
          }
          static int lua_imgui_set_size(lua_State* L) {
              imgui::SetNextWindowSize(ImVec2((float)luaL_checknumber(L, 1), (float)luaL_checknumber(L, 2)));
              return 0;
          }
          static int lua_imgui_text(lua_State* L) { imgui::TextUnformatted(luaL_checkstring(L, 1)); return 0; }
          static int lua_imgui_text_colored(lua_State* L) {
              const char* txt = luaL_checkstring(L, 1);
              float r = (float)luaL_checknumber(L, 2), g = (float)luaL_checknumber(L, 3), b = (float)luaL_checknumber(L, 4), a = (float)luaL_optnumber(L, 5, 1.0);
              imgui::TextColored(ImVec4(r, g, b, a), "%s", txt);
              return 0;
          }
          static int lua_imgui_text_disabled(lua_State* L) { imgui::TextDisabled("%s", luaL_checkstring(L, 1)); return 0; }
          static int lua_imgui_separator(lua_State* L) { imgui::Separator(); return 0; }
          static int lua_imgui_spacing(lua_State* L) { imgui::Spacing(); return 0; }
          static int lua_imgui_button(lua_State* L) {
              const char* lbl = luaL_checkstring(L, 1);
              float w = (float)luaL_optnumber(L, 2, 0.0), h = (float)luaL_optnumber(L, 3, 0.0);
              lua_pushboolean(L, imgui::Button(lbl, ImVec2(w, h)));
              return 1;
          }
          static int lua_imgui_checkbox(lua_State* L) {
              const char* lbl = luaL_checkstring(L, 1);
              bool val = lua_toboolean(L, 2);
              bool changed = imgui::Checkbox(lbl, &val);
              lua_pushboolean(L, changed);
              lua_pushboolean(L, val);
              return 2;
          }
          static int lua_imgui_slider_float(lua_State* L) {
              const char* lbl = luaL_checkstring(L, 1);
              float val = (float)luaL_checknumber(L, 2);
              float min = (float)luaL_checknumber(L, 3);
              float max = (float)luaL_checknumber(L, 4);
              bool changed = imgui::SliderFloat(lbl, &val, min, max, "%.1fx");
              lua_pushboolean(L, changed);
              lua_pushnumber(L, val);
              return 2;
          }
          static int lua_imgui_set_color(lua_State* L) {
              int idx = (int)luaL_checkinteger(L, 1);
              float r = (float)luaL_checknumber(L, 2), g = (float)luaL_checknumber(L, 3), b = (float)luaL_checknumber(L, 4), a = (float)luaL_checknumber(L, 5);
              if (idx >= 0 && idx < ImGuiCol_COUNT) imgui::GetStyle().Colors[idx] = ImVec4(r, g, b, a);
              return 0;
          }
          static int lua_imgui_push_font(lua_State* L) {
              int f = (int)luaL_checkinteger(L, 1);
              if (f == 0 && g_FontTahoma) imgui::PushFont(g_FontTahoma);
              else if (f == 1 && g_FontTrebuchet) imgui::PushFont(g_FontTrebuchet);
              return 0;
          }
          static int lua_imgui_pop_font(lua_State* L) { imgui::PopFont(); return 0; }
          static int lua_imgui_draw_badge(lua_State* L) {
              const char* lbl = luaL_checkstring(L, 1);
              float px = (float)luaL_checknumber(L, 2), py = (float)luaL_checknumber(L, 3);
              ImDrawList* draw = imgui::GetBackgroundDrawList();
              draw->AddCircleFilled(ImVec2(px, py), 18.0f, IM_COL32(30, 30, 34, 200));
              draw->AddCircle(ImVec2(px, py), 18.0f, IM_COL32(110, 110, 120, 240), 16, 2.0f);
              ImVec2 ts = imgui::CalcTextSize(lbl);
              draw->AddText(ImVec2(px - ts.x * 0.5f, py - ts.y * 0.5f), IM_COL32(230, 230, 235, 255), lbl);
              return 0;
          }

          static void RegisterLuaBindings(lua_State* L) {
              lua_newtable(L);
              lua_pushcfunction(L, lua_host_send_key); lua_setfield(L, -2, "send_key");
              lua_pushcfunction(L, lua_host_toggle_fps); lua_setfield(L, -2, "toggle_fps_aim");
              lua_pushcfunction(L, lua_host_is_bridge); lua_setfield(L, -2, "is_bridge_connected");
              lua_pushcfunction(L, lua_host_set_sens); lua_setfield(L, -2, "set_sensitivity");
              lua_pushcfunction(L, lua_host_reload); lua_setfield(L, -2, "reload_interface");
              lua_setglobal(L, "host");

              lua_newtable(L);
              lua_pushcfunction(L, lua_imgui_begin); lua_setfield(L, -2, "Begin");
              lua_pushcfunction(L, lua_imgui_end); lua_setfield(L, -2, "End");
              lua_pushcfunction(L, lua_imgui_set_pos); lua_setfield(L, -2, "SetNextWindowPos");
              lua_pushcfunction(L, lua_imgui_set_size); lua_setfield(L, -2, "SetNextWindowSize");
              lua_pushcfunction(L, lua_imgui_text); lua_setfield(L, -2, "Text");
              lua_pushcfunction(L, lua_imgui_text_colored); lua_setfield(L, -2, "TextColored");
              lua_pushcfunction(L, lua_imgui_text_disabled); lua_setfield(L, -2, "TextDisabled");
              lua_pushcfunction(L, lua_imgui_separator); lua_setfield(L, -2, "Separator");
              lua_pushcfunction(L, lua_imgui_spacing); lua_setfield(L, -2, "Spacing");
              lua_pushcfunction(L, lua_imgui_button); lua_setfield(L, -2, "Button");
              lua_pushcfunction(L, lua_imgui_checkbox); lua_setfield(L, -2, "Checkbox");
              lua_pushcfunction(L, lua_imgui_slider_float); lua_setfield(L, -2, "SliderFloat");
              lua_pushcfunction(L, lua_imgui_set_color); lua_setfield(L, -2, "SetColor");
              lua_pushcfunction(L, lua_imgui_push_font); lua_setfield(L, -2, "PushFont");
              lua_pushcfunction(L, lua_imgui_pop_font); lua_setfield(L, -2, "PopFont");
              lua_pushcfunction(L, lua_imgui_draw_badge); lua_setfield(L, -2, "DrawKeyBadge");

              #define BIND_COL(name) lua_pushinteger(L, ImGuiCol_##name); lua_setfield(L, -2, "Col_" #name);
              BIND_COL(WindowBg); BIND_COL(ChildBg); BIND_COL(Border); BIND_COL(BorderShadow);
              BIND_COL(FrameBg); BIND_COL(FrameBgHovered); BIND_COL(FrameBgActive);
              BIND_COL(TitleBg); BIND_COL(TitleBgActive); BIND_COL(CheckMark);
              BIND_COL(SliderGrab); BIND_COL(SliderGrabActive); BIND_COL(Button);
              BIND_COL(ButtonHovered); BIND_COL(ButtonActive); BIND_COL(Header);
              BIND_COL(HeaderHovered); BIND_COL(HeaderActive); BIND_COL(Separator);
              BIND_COL(Text); BIND_COL(TextDisabled);
              #undef BIND_COL

              lua_setglobal(L, "imgui");
          }

          static BOOL CALLBACK EnumHijackProc(HWND hwnd, LPARAM) {
              char title[128]; GetWindowTextA(hwnd, title, sizeof(title));
              if ((strstr(title, "BlueStacks") || strstr(title, "LDPlayer") || strstr(title, "QEMU")) && IsWindowVisible(hwnd) && hwnd != g_hMainWnd) {
                  g_hHijackedWnd = hwnd;
                  return FALSE;
              }
              return TRUE;
          }

          static void HijackThread() {
              while (g_Running && !g_hHijackedWnd) {
                  EnumWindows(EnumHijackProc, 0);
                  Sleep(500);
              }
              if (g_hHijackedWnd && g_hViewportWnd) {
                  LONG_PTR st = GetWindowLongPtr(g_hHijackedWnd, GWL_STYLE);
                  st &= ~(WS_POPUP | WS_CAPTION | WS_THICKFRAME | WS_MINIMIZEBOX | WS_MAXIMIZEBOX | WS_SYSMENU);
                  st |= (WS_CHILD | WS_VISIBLE);
                  SetWindowLongPtr(g_hHijackedWnd, GWL_STYLE, st);
                  SetParent(g_hHijackedWnd, g_hViewportWnd);
                  RECT rc; GetClientRect(g_hViewportWnd, &rc);
                  MoveWindow(g_hHijackedWnd, 0, 0, rc.right, rc.bottom, TRUE);
              }
          }

          static void BridgeThread() {
              sockaddr_in a{AF_INET, htons(8888)};
              inet_pton(AF_INET, "127.0.0.1", &a.sin_addr);
              while (g_Running) {
                  SOCKET s = socket(AF_INET, SOCK_STREAM, 0);
                  int opt = 1; setsockopt(s, IPPROTO_TCP, TCP_NODELAY, (const char*)&opt, sizeof(opt));
                  if (connect(s, (sockaddr*)&a, sizeof(a)) == 0) {
                      g_BridgeSock = s; g_BridgeConnected = true; break;
                  }
                  closesocket(s); Sleep(1000);
              }
          }

          static LRESULT WINAPI MainWndProc(HWND hWnd, UINT msg, WPARAM wParam, LPARAM lParam) {
              if (ImGui_ImplWin32_WndProcHandler(hWnd, msg, wParam, lParam)) return true;
              switch (msg) {
              case WM_SIZE:
                  if (g_pd3dDevice && wParam != SIZE_MINIMIZED) {
                      if (g_mainRenderTargetView) { g_mainRenderTargetView->Release(); g_mainRenderTargetView = nullptr; }
                      g_pSwapChain->ResizeBuffers(0, LOWORD(lParam), HIWORD(lParam), DXGI_FORMAT_UNKNOWN, 0);
                      ID3D11Texture2D* b = nullptr; g_pSwapChain->GetBuffer(0, IID_PPV_ARGS(&b));
                      g_pd3dDevice->CreateRenderTargetView(b, nullptr, &g_mainRenderTargetView); b->Release();
                      if (g_hViewportWnd) {
                          MoveWindow(g_hViewportWnd, 0, 0, LOWORD(lParam) - 260, HIWORD(lParam), TRUE);
                          if (g_hHijackedWnd) MoveWindow(g_hHijackedWnd, 0, 0, LOWORD(lParam) - 260, HIWORD(lParam), TRUE);
                      }
                  }
                  return 0;
              case WM_KEYDOWN:
                  if (wParam == VK_F10) {
                      g_FpsAimMode = !g_FpsAimMode;
                      if (g_FpsAimMode) { RECT rc; GetWindowRect(g_hViewportWnd, &rc); ClipCursor(&rc); ShowCursor(FALSE); }
                      else { ClipCursor(nullptr); ShowCursor(TRUE); }
                      return 0;
                  }
                  return 0;
              case WM_DESTROY:
                  g_Running = false;
                  PostQuitMessage(0);
                  return 0;
              }
              return DefWindowProcA(hWnd, msg, wParam, lParam);
          }

          int WINAPI WinMain(HINSTANCE hInst, HINSTANCE, LPSTR, int nCmdShow) {
              WSADATA wsa; WSAStartup(MAKEWORD(2, 2), &wsa);

              WNDCLASSEXA wc = { sizeof(wc), CS_CLASSDC, MainWndProc, 0, 0, hInst, nullptr, nullptr, nullptr, nullptr, "EmuStacksMain", nullptr };
              RegisterClassExA(&wc);
              g_hMainWnd = CreateWindowA("EmuStacksMain", "EmuStacks // MIMGUI RUNTIME", WS_OVERLAPPEDWINDOW, 100, 100, 1280, 720, nullptr, nullptr, hInst, nullptr);

              BOOL dark = TRUE;
              DwmSetWindowAttribute(g_hMainWnd, 20, &dark, sizeof(dark));

              WNDCLASSEXA wcv = { sizeof(wcv), CS_CLASSDC, DefWindowProcA, 0, 0, hInst, nullptr, nullptr, nullptr, nullptr, "EmuStacksViewport", nullptr };
              RegisterClassExA(&wcv);
              g_hViewportWnd = CreateWindowA("EmuStacksViewport", nullptr, WS_CHILD | WS_VISIBLE | WS_CLIPCHILDREN, 0, 0, 1020, 720, g_hMainWnd, nullptr, hInst, nullptr);

              DXGI_SWAP_CHAIN_DESC sd{};
              sd.BufferCount = 2; sd.BufferDesc.Format = DXGI_FORMAT_R8G8B8A8_UNORM;
              sd.BufferUsage = DXGI_USAGE_RENDER_TARGET_OUTPUT; sd.OutputWindow = g_hMainWnd;
              sd.SampleDesc.Count = 1; sd.Windowed = TRUE; sd.SwapEffect = DXGI_SWAP_EFFECT_DISCARD;

              D3D_FEATURE_LEVEL fl = D3D_FEATURE_LEVEL_11_0;
              D3D11CreateDeviceAndSwapChain(nullptr, D3D_DRIVER_TYPE_HARDWARE, nullptr, 0, &fl, 1, D3D11_SDK_VERSION, &sd, &g_pSwapChain, &g_pd3dDevice, nullptr, &g_pd3dDeviceContext);
              ID3D11Texture2D* backBuf = nullptr;
              g_pSwapChain->GetBuffer(0, IID_PPV_ARGS(&backBuf));
              g_pd3dDevice->CreateRenderTargetView(backBuf, nullptr, &g_mainRenderTargetView);
              backBuf->Release();

              ShowWindow(g_hMainWnd, nCmdShow);
              UpdateWindow(g_hMainWnd);

              IMGUI_CHECKVERSION();
              imgui::CreateContext();

              ImGuiIO& io = imgui::GetIO();
              g_FontTahoma = io.Fonts->AddFontFromFileTTF("C:\\Windows\\Fonts\\tahoma.ttf", 15.0f);
              g_FontTrebuchet = io.Fonts->AddFontFromFileTTF("C:\\Windows\\Fonts\\trebuc.ttf", 18.0f);
              if (!g_FontTahoma) g_FontTahoma = io.Fonts->AddFontDefault();
              if (!g_FontTrebuchet) g_FontTrebuchet = g_FontTahoma;

              ImGui_ImplWin32_Init(g_hMainWnd);
              ImGui_ImplDX11_Init(g_pd3dDevice, g_pd3dDeviceContext);

              g_Lua = luaL_newstate();
              luaL_openlibs(g_Lua);
              RegisterLuaBindings(g_Lua);

              if (luaL_dofile(g_Lua, "scripts/interface.lua") == LUA_OK) {
                  lua_setglobal(g_Lua, "UIModule");
                  lua_getglobal(g_Lua, "UIModule");
                  lua_getfield(L, -1, "apply_palette");
                  lua_pcall(g_Lua, 0, 0, 0);
                  lua_pop(g_Lua, 1);
              }

              std::thread(HijackThread).detach();
              std::thread(BridgeThread).detach();

              MSG msg{};
              while (msg.message != WM_QUIT) {
                  if (PeekMessage(&msg, nullptr, 0U, 0U, PM_REMOVE)) {
                      TranslateMessage(&msg); DispatchMessage(&msg); continue;
                  }
                  ImGui_ImplDX11_NewFrame();
                  ImGui_ImplWin32_NewFrame();
                  imgui::NewFrame();

                  RECT cr; GetClientRect(g_hMainWnd, &cr);
                  float w = (float)(cr.right - cr.left), h = (float)(cr.bottom - cr.top);

                  {
                      std::lock_guard<std::mutex> lk(g_LuaLock);
                      if (g_Lua) {
                          lua_getglobal(g_Lua, "UIModule");
                          lua_getfield(g_Lua, -1, "render_frame");
                          lua_pushnumber(g_Lua, w);
                          lua_pushnumber(g_Lua, h);
                          lua_pcall(g_Lua, 2, 0, 0);
                          lua_pop(g_Lua, 1);
                      }
                  }

                  imgui::Render();
                  const float clear[4] = { 0.08f, 0.08f, 0.09f, 1.0f };
                  g_pd3dDeviceContext->OMSetRenderTargets(1, &g_mainRenderTargetView, nullptr);
                  g_pd3dDeviceContext->ClearRenderTargetView(g_mainRenderTargetView, clear);
                  ImGui_ImplDX11_RenderDrawData(imgui::GetDrawData());
                  g_pSwapChain->Present(1, 0);
              }

              if (g_Lua) lua_close(g_Lua);
              WSACleanup();
              return 0;
          }
          '@ -Encoding UTF8

          # 3. CMakeLists.txt с автоматической подкачкой ImGui через FetchContent
          Set-Content -Path "host/CMakeLists.txt" -Value @'
          cmake_minimum_required(VERSION 3.20)
          project(emustacks CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          include(FetchContent)
          FetchContent_Declare(
              imgui
              GIT_REPOSITORY https://github.com/ocornut/imgui.git
              GIT_TAG        v1.90.4
          )
          FetchContent_MakeAvailable(imgui)

          find_package(Lua REQUIRED)

          set(IMGUI_SOURCES
              ${imgui_SOURCE_DIR}/imgui.cpp
              ${imgui_SOURCE_DIR}/imgui_draw.cpp
              ${imgui_SOURCE_DIR}/imgui_tables.cpp
              ${imgui_SOURCE_DIR}/imgui_widgets.cpp
              ${imgui_SOURCE_DIR}/backends/imgui_impl_win32.cpp
              ${imgui_SOURCE_DIR}/backends/imgui_impl_dx11.cpp
          )

          add_executable(emustacks WIN32 emustacks_host.cpp ${IMGUI_SOURCES})

          target_include_directories(emustacks PRIVATE
              ${LUA_INCLUDE_DIR}
              ${imgui_SOURCE_DIR}
              ${imgui_SOURCE_DIR}/backends
          )

          target_compile_options(emustacks PRIVATE
              $<$<CXX_COMPILER_ID:MSVC>:/O2 /GL /MP /Gy /W3>
          )

          target_link_options(emustacks PRIVATE
              $<$<CXX_COMPILER_ID:MSVC>:/LTCG /OPT:REF /OPT:ICF>
          )

          target_link_libraries(emustacks PRIVATE
              ${LUA_LIBRARIES}
              d3d11
              dxgi
              ws2_32
              user32
              gdi32
              dwmapi
          )
          '@ -Encoding UTF8

          cmake -B host/build -S host -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build host/build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: emustacks-host
          path: host/build/Release/emustacks.exe

  package-ready-emulator:
    needs: [build-guest-daemon, build-host-client]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Workspace & Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundle"
          New-Item -ItemType Directory -Force -Path "bundle/qemu"
          New-Item -ItemType Directory -Force -Path "bundle/tools"
          New-Item -ItemType Directory -Force -Path "bundle/scripts"

      - uses: actions/download-artifact@v4
        with:
          name: emustacks-daemon
          path: bundle/

      - uses: actions/download-artifact@v4
        with:
          name: emustacks-host
          path: bundle/

      - name: Fetch and Debloat QEMU
        shell: pwsh
        run: |
          choco install qemu -y --no-progress
          $qemuSource = "C:\Program Files\qemu"
          Copy-Item "$qemuSource\qemu-system-x86_64.exe" "bundle/qemu/"
          Copy-Item "$qemuSource\*.dll" "bundle/qemu/"
          Copy-Item -Recurse "$qemuSource\share" "bundle/qemu/" -ErrorAction SilentlyContinue
          Copy-Item -Recurse "$qemuSource\keymaps" "bundle/qemu/" -ErrorAction SilentlyContinue

      - name: Fetch and Debloat ADB
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "adb.zip"
          Expand-Archive -Path "adb.zip" -DestinationPath "temp_adb"
          Copy-Item "temp_adb/platform-tools/adb.exe" "bundle/tools/"
          Copy-Item "temp_adb/platform-tools/AdbWinApi.dll" "bundle/tools/"
          Copy-Item "temp_adb/platform-tools/AdbWinUsbApi.dll" "bundle/tools/"
          Remove-Item -Recurse -Force "temp_adb"
          Remove-Item "adb.zip"

      - name: Fetch Android OS Image
        shell: pwsh
        run: |
          $osUrl = "https://master.dl.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso?viasf=1"
          Invoke-WebRequest -Uri $osUrl -OutFile "bundle/android_root.img"

      - name: Generate Runtime Launcher (run.bat) & Finalize
        shell: pwsh
        run: |
          Set-Content -Path "bundle/run.bat" -Value @'
          @echo off
          setlocal enabledelayedexpansion
          cd /d "%~dp0"
          title EmuStacks // Portable Runtime

          set "PATH=%~dp0qemu;%~dp0tools;%PATH%"

          if not exist "qemu\qemu-system-x86_64.exe" (
              echo [!] Internal QEMU not found.
              pause
              exit /b 1
          )

          start "" "qemu\qemu-system-x86_64.exe" -accel whpx -smp 4 -m 4096 -hda android_root.img -device virtio-vga,virgl=on -display sdl,gl=on -net nic,model=virtio -net user,hostfwd=tcp::5555-:5555,hostfwd=tcp::8888-:8888

          start "" emustacks.exe

          :WAIT_ADB
          timeout /t 3 /nobreak >nul
          tools\adb.exe connect 127.0.0.1:5555 >nul 2>&1
          tools\adb.exe shell getprop sys.boot_completed 2>nul | find "1" >nul
          if errorlevel 1 goto WAIT_ADB

          tools\adb.exe push emustacks_daemon /data/local/tmp/emustacks_daemon >nul
          tools\adb.exe shell "chmod 777 /data/local/tmp/emustacks_daemon"
          start "" tools\adb.exe shell "/data/local/tmp/emustacks_daemon"
          '@ -Encoding ASCII

          Copy-Item "scripts/interface.lua" "bundle/scripts/"
          Compress-Archive -Path "bundle/*" -DestinationPath "EmuStacks-Ultimate-Portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: EmuStacks-Ultimate-Portable
          path: EmuStacks-Ultimate-Portable.zip
